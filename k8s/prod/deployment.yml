apiVersion: apps/v1
kind: Deployment
metadata:
  name: academico-gateway
  namespace: academico-prod
  labels:
    app.kubernetes.io/name: academico-gateway
    app.kubernetes.io/part-of: academico
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: academico-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: academico-gateway
        app.kubernetes.io/part-of: academico
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - academico-prod-microservicios
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: academico-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: academico-gateway
          image: acracademicoutn.azurecr.io/academicmgmtorgacademicogateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50050
              protocol: TCP
          envFrom:
            - secretRef:
                name: academico-gateway-env
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
