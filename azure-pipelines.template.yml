        REMOTE_GATEWAY_PATH: $(prodGatewayPath)
        COMPOSE_FILE: $(composeFile)
        COMPOSE_SOURCE_FILE: $(Build.SourcesDirectory)/$(composeFile)
        SERVICE_NAME: $(serviceName)
        CONTAINER_NAME: $(containerName)
        ENV_VARIABLE_NAMES: $(deploymentEnvVariableNames)
        ENV_BASE_URL_HOST: $(prodMicroservicesHost)
        DEPLOY_ENVIRONMENT_NAME: production
        NODE_ENV: $(nodeEnv)
        LOG_LEVEL: $(logLevel)
        REDIS_PROTOCOL: $(REDIS_PROTOCOL)
        REDIS_HOST: $(REDIS_HOST)
        REDIS_PORT: $(REDIS_PORT)
        REDIS_PASSWORD: $(REDIS_PASSWORD)
        LOGIN_BASE_URL: $(LOGIN_BASE_URL)
        LOGIN_API_KEY: $(LOGIN_API_KEY)
        USUARIOS_BASE_URL: $(USUARIOS_BASE_URL)
        USUARIOS_API_KEY: $(USUARIOS_API_KEY)
        NOTIFICACIONES_BASE_URL: $(NOTIFICACIONES_BASE_URL)
