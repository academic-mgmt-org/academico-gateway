# Docker
# Build, publish and deploy academico-gateway image to Azure development and production Kubernetes.

trigger:
  branches:
    include:
    - main

pr: none

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '5cffc302-0a35-4b2b-8ea1-04a9ebd67c07'
  imageRepository: 'academicmgmtorgacademicogateway'
  containerRegistry: 'acracademicoutn.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  selfHostedPool: 'Default'

  serviceName: 'academico-gateway'
  containerName: 'academico-gateway'
  composeFile: 'docker-compose.yml'
  grpcPort: '50050'
  sshUser: 'azureuser'

  devSshHost: '20.122.210.230'
  devGatewayHost: 'academia-dev.eastus2.cloudapp.azure.com'
  devMicroservicesHost: '20.114.139.164'
  devGatewayPath: '/home/azureuser/academico-gateway'
  devSshKey: '/home/azureuser/CREDENCIALES/academico-dev-gateway.pem'
  devSshKeyFallback: '/home/azureuser/academico-dev-gateway.pem'

  prodSshHost: '20.96.156.43'
  prodGatewayHost: 'academia-utn.eastus2.cloudapp.azure.com'
  prodMicroservicesHost: '20.115.132.131'
  prodGatewayPath: '/home/azureuser/academico-gateway'
  prodSshKey: '/home/azureuser/academico-prod-gateway.pem'
  prodSshKeyFallback: '/home/azureuser/CREDENCIALES/academico-prod-gateway.pem'

  prodK8sSshHost: '20.115.132.131'
  k8sNamespace: 'academico-prod'
  k8sManifestDir: '$(Build.SourcesDirectory)/k8s/prod'
  k8sRemoteManifestPath: '/tmp/academico-gateway-k8s-manifests'
  imagePullSecretName: 'acr-pull-secret'
  appSecretName: 'academico-gateway-env'
  rolloutTimeout: '5m'

  productionApprover: 'gacalderonr@utn.edu.ec'

stages:
- stage: Build
  displayName: Build and push gateway image
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: Build
    displayName: Build and push
    pool:
      name: $(selfHostedPool)
    steps:
    - checkout: none

    - script: |
        set -euo pipefail

        TARGET_MOUNT="${CLEANUP_TARGET_MOUNT:-/}"
        CACHE_PRUNE_THRESHOLD="${DOCKER_CACHE_PRUNE_THRESHOLD_PERCENT:-75}"
        FULL_PRUNE_THRESHOLD="${DOCKER_FULL_PRUNE_THRESHOLD_PERCENT:-85}"
        DOCKER_PRUNE_UNTIL="${DOCKER_PRUNE_UNTIL:-24h}"

        disk_used_percent() {
          df -P "$TARGET_MOUNT" | awk 'NR==2 { gsub(/%/, "", $5); print $5 }'
        }

        echo "Disk usage before cleanup:"
        df -h "$TARGET_MOUNT"

        echo "Cleaning agent temp directory..."
        if [ -n "${AGENT_TEMPDIRECTORY:-}" ] && [ -d "$AGENT_TEMPDIRECTORY" ]; then
          find "$AGENT_TEMPDIRECTORY" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
        fi

        used_percent="$(disk_used_percent)"
        if command -v docker >/dev/null 2>&1 && timeout 15 docker info >/dev/null 2>&1; then
          if [ "$used_percent" -ge "$FULL_PRUNE_THRESHOLD" ]; then
            echo "Disk usage is ${used_percent}%; running full Docker prune."
            docker system prune -af || true
          elif [ "$used_percent" -ge "$CACHE_PRUNE_THRESHOLD" ]; then
            echo "Disk usage is ${used_percent}%; pruning Docker cache older than ${DOCKER_PRUNE_UNTIL}."
            docker container prune -f --filter "until=${DOCKER_PRUNE_UNTIL}" || true
            docker builder prune -af --filter "until=${DOCKER_PRUNE_UNTIL}" || true
          else
            echo "Disk usage is ${used_percent}%; skipping Docker cleanup."
          fi
        else
          echo "Docker is not available to the agent user; skipping Docker cleanup."
        fi

        echo "Disk usage after cleanup:"
        df -h "$TARGET_MOUNT"
      displayName: Free disk space on self-hosted agent
      env:
        AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

    - checkout: self
      clean: true
      path: s

    - task: Docker@2
      displayName: Build and push image to ACR
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest
        addPipelineData: false

- stage: DeployDevelopment
  displayName: Deploy to development server 20.122.210.230
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployDevelopment
    displayName: Deploy gateway to development
    pool:
      name: $(selfHostedPool)
    steps:
    - checkout: none

    - script: |
        set -euo pipefail

        TARGET_MOUNT="${CLEANUP_TARGET_MOUNT:-/}"
        CACHE_PRUNE_THRESHOLD="${DOCKER_CACHE_PRUNE_THRESHOLD_PERCENT:-75}"
        FULL_PRUNE_THRESHOLD="${DOCKER_FULL_PRUNE_THRESHOLD_PERCENT:-85}"
        DOCKER_PRUNE_UNTIL="${DOCKER_PRUNE_UNTIL:-24h}"

        disk_used_percent() {
          df -P "$TARGET_MOUNT" | awk 'NR==2 { gsub(/%/, "", $5); print $5 }'
        }

        echo "Disk usage before cleanup:"
        df -h "$TARGET_MOUNT"

        echo "Cleaning agent temp directory..."
        if [ -n "${AGENT_TEMPDIRECTORY:-}" ] && [ -d "$AGENT_TEMPDIRECTORY" ]; then
          find "$AGENT_TEMPDIRECTORY" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
        fi

        used_percent="$(disk_used_percent)"
        if command -v docker >/dev/null 2>&1 && timeout 15 docker info >/dev/null 2>&1; then
          if [ "$used_percent" -ge "$FULL_PRUNE_THRESHOLD" ]; then
            echo "Disk usage is ${used_percent}%; running full Docker prune."
            docker system prune -af || true
          elif [ "$used_percent" -ge "$CACHE_PRUNE_THRESHOLD" ]; then
            echo "Disk usage is ${used_percent}%; pruning Docker cache older than ${DOCKER_PRUNE_UNTIL}."
            docker container prune -f --filter "until=${DOCKER_PRUNE_UNTIL}" || true
            docker builder prune -af --filter "until=${DOCKER_PRUNE_UNTIL}" || true
          else
            echo "Disk usage is ${used_percent}%; skipping Docker cleanup."
          fi
        else
          echo "Docker is not available to the agent user; skipping Docker cleanup."
        fi

        echo "Disk usage after cleanup:"
        df -h "$TARGET_MOUNT"
      displayName: Free disk space on self-hosted agent
      env:
        AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

    - checkout: self
      clean: true
      path: s

    - task: Docker@2
      displayName: Login to Azure Container Registry
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - script: |
        set -euo pipefail

        require_env() {
          local name="$1"
          local value="${!name:-}"

          if [ -z "$value" ] || [[ "$value" == \$\(* ]]; then
            echo "Missing required environment variable: $name"
            exit 1
          fi
        }

        resolve_ssh_key() {
          local primary="$1"
          local fallback="${2:-}"

          if [ -f "$primary" ]; then
            printf '%s\n' "$primary"
            return 0
          fi

          if [ -n "$fallback" ] && [ -f "$fallback" ]; then
            printf '%s\n' "$fallback"
            return 0
          fi

          echo "SSH key not found. Tried: $primary ${fallback:-}" >&2
          return 1
        }

        for name in CONTAINER_REGISTRY IMAGE_REPOSITORY TAG SSH_HOST SSH_USER REMOTE_GATEWAY_PATH COMPOSE_SOURCE_FILE SERVICE_NAME AUTH_API_KEY NOTIFICACIONES_API_KEY GATEWAY_GRPC_PORT LOGIN_BASE_URL NOTIFICACIONES_BASE_URL; do
          require_env "$name"
        done

        if [ ! -f "$COMPOSE_SOURCE_FILE" ]; then
          echo "Missing compose source file: $COMPOSE_SOURCE_FILE"
          exit 1
        fi

        SSH_KEY="$(resolve_ssh_key "$SSH_KEY_PATH" "$SSH_KEY_FALLBACK")"
        chmod 600 "$SSH_KEY"

        IMAGE="${CONTAINER_REGISTRY}/${IMAGE_REPOSITORY}:${TAG}"
        REMOTE="${SSH_USER}@${SSH_HOST}"
        ENV_FILE_LOCAL="$(mktemp)"

        cleanup() {
          rm -f "$ENV_FILE_LOCAL"
        }
        trap cleanup EXIT

        SSH_OPTS=(
          -i "$SSH_KEY"
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=accept-new
        )

        DOCKER_CONFIG_FILE="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
        if [ ! -f "$DOCKER_CONFIG_FILE" ]; then
          echo "Missing Docker config after ACR login: $DOCKER_CONFIG_FILE"
          exit 1
        fi

        umask 077
        {
          printf 'NODE_ENV=production\n'
          printf 'LOGIN_BASE_URL=%s\n' "$LOGIN_BASE_URL"
          printf 'LOGIN_API_KEY=%s\n' "$AUTH_API_KEY"
          printf 'NOTIFICACIONES_BASE_URL=%s\n' "$NOTIFICACIONES_BASE_URL"
          printf 'NOTIFICACIONES_API_KEY=%s\n' "$NOTIFICACIONES_API_KEY"
          printf 'GRPC_PORT=%s\n' "$GATEWAY_GRPC_PORT"
          printf 'GATEWAY_IMAGE=%s\n' "$IMAGE"
          printf 'LOG_LEVEL=info\n'
        } > "$ENV_FILE_LOCAL"

        echo "Copying ACR Docker login to development server..."
        ssh "${SSH_OPTS[@]}" "$REMOTE" "mkdir -p ~/.docker && umask 077 && cat > ~/.docker/config.json" < "$DOCKER_CONFIG_FILE"

        echo "Updating development .env and compose file..."
        ssh "${SSH_OPTS[@]}" "$REMOTE" "mkdir -p '$REMOTE_GATEWAY_PATH' && umask 077 && cat > '$REMOTE_GATEWAY_PATH/.env.pipeline'" < "$ENV_FILE_LOCAL"
        ssh "${SSH_OPTS[@]}" "$REMOTE" "mv '$REMOTE_GATEWAY_PATH/.env.pipeline' '$REMOTE_GATEWAY_PATH/.env' && chmod 600 '$REMOTE_GATEWAY_PATH/.env'"
        ssh "${SSH_OPTS[@]}" "$REMOTE" "cat > '$REMOTE_GATEWAY_PATH/$COMPOSE_FILE'" < "$COMPOSE_SOURCE_FILE"

        echo "Deploying development gateway container..."
        ssh "${SSH_OPTS[@]}" "$REMOTE" \
          "REMOTE_GATEWAY_PATH='$REMOTE_GATEWAY_PATH' COMPOSE_FILE='$COMPOSE_FILE' SERVICE_NAME='$SERVICE_NAME' GATEWAY_GRPC_PORT='$GATEWAY_GRPC_PORT' bash -se" << 'REMOTE_SCRIPT'
        set -euo pipefail

        cd "$REMOTE_GATEWAY_PATH"

        wait_for_service() {
          local service="$1"
          local attempts=24
          local container_id=""
          local status=""

          for attempt in $(seq 1 "$attempts"); do
            container_id="$(docker compose --env-file .env -f "$COMPOSE_FILE" ps -q "$service" || true)"
            if [ -n "$container_id" ]; then
              status="$(docker inspect -f '{{.State.Status}}' "$container_id" 2>/dev/null || true)"
              if [ "$status" = "running" ]; then
                printf '%s\n' "$container_id"
                return 0
              fi
            fi
            sleep 5
          done

          echo "Service $service did not stay running." >&2
          docker compose --env-file .env -f "$COMPOSE_FILE" ps >&2 || true
          docker compose --env-file .env -f "$COMPOSE_FILE" logs --tail=200 "$service" >&2 || true
          exit 1
        }

        wait_for_host_port() {
          local service="$1"
          local port="$2"
          local attempts=24

          for attempt in $(seq 1 "$attempts"); do
            if command -v nc >/dev/null 2>&1; then
              if nc -z 127.0.0.1 "$port"; then
                return 0
              fi
            elif timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/${port}"; then
              return 0
            fi

            sleep 5
          done

          echo "Gateway is not listening on host gRPC port ${port}." >&2
          docker compose --env-file .env -f "$COMPOSE_FILE" ps >&2 || true
          docker compose --env-file .env -f "$COMPOSE_FILE" logs --tail=200 "$service" >&2 || true
          exit 1
        }

        echo "Validating compose configuration..."
        docker compose --env-file .env -f "$COMPOSE_FILE" config >/dev/null

        echo "Stopping previous gateway container..."
        docker compose --env-file .env -f "$COMPOSE_FILE" down --remove-orphans || true

        echo "Pulling gateway image..."
        docker compose --env-file .env -f "$COMPOSE_FILE" pull "$SERVICE_NAME"

        echo "Starting gateway service..."
        docker compose --env-file .env -f "$COMPOSE_FILE" up -d --remove-orphans --no-build "$SERVICE_NAME"

        echo "Verifying gateway service..."
        container_id="$(wait_for_service "$SERVICE_NAME")"
        network_mode="$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$container_id")"
        if [ "$network_mode" != "host" ]; then
          echo "Gateway container must use host networking, got: $network_mode"
          exit 1
        fi
        if docker port "$container_id" 2>/dev/null | grep -q .; then
          echo "Host-networked gateway must not publish Docker ports."
          docker port "$container_id" || true
          exit 1
        fi
        wait_for_host_port "$SERVICE_NAME" "$GATEWAY_GRPC_PORT"
        echo "Gateway is listening on host gRPC port ${GATEWAY_GRPC_PORT}."

        docker compose --env-file .env -f "$COMPOSE_FILE" ps
        docker image prune -f

        echo "Development deployment completed."
        REMOTE_SCRIPT

        if [ -z "${PUBLIC_GRPC_HOST:-}" ]; then
          echo "PUBLIC_GRPC_HOST is not set; skipping public descriptor check."
        elif command -v grpcurl >/dev/null 2>&1; then
          echo "Checking gRPC descriptor on development endpoint..."
          for attempt in $(seq 1 12); do
            if grpcurl -plaintext "${PUBLIC_GRPC_HOST}:${GATEWAY_GRPC_PORT}" describe auth.v1.AuthService 2>/tmp/gateway-grpcurl.err | grep -q 'ResetPassword'; then
              echo "ResetPassword is available through development gateway."
              exit 0
            fi
            sleep 5
          done
          cat /tmp/gateway-grpcurl.err || true
          echo "ResetPassword was not found on development gateway."
          exit 1
        else
          echo "grpcurl is not installed on the deploy agent; skipping descriptor check."
        fi
      displayName: Deploy academico-gateway to development
      env:
        CONTAINER_REGISTRY: $(containerRegistry)
        IMAGE_REPOSITORY: $(imageRepository)
        TAG: $(tag)
        SSH_HOST: $(devSshHost)
        SSH_USER: $(sshUser)
        SSH_KEY_PATH: $(devSshKey)
        SSH_KEY_FALLBACK: $(devSshKeyFallback)
        REMOTE_GATEWAY_PATH: $(devGatewayPath)
        COMPOSE_FILE: $(composeFile)
        COMPOSE_SOURCE_FILE: $(Build.SourcesDirectory)/$(composeFile)
        SERVICE_NAME: $(serviceName)
        CONTAINER_NAME: $(containerName)
        AUTH_API_KEY: $(USUARIOS_API_KEY)
        NOTIFICACIONES_API_KEY: $(NOTIFICACIONES_API_KEY)
        LOGIN_BASE_URL: http://$(devMicroservicesHost):3001
        NOTIFICACIONES_BASE_URL: http://$(devMicroservicesHost):3003
        GATEWAY_GRPC_PORT: $(grpcPort)
        PUBLIC_GRPC_HOST: $(devGatewayHost)

- stage: ApproveProduction
  displayName: Approve production Kubernetes deployment
  dependsOn: DeployDevelopment
  condition: succeeded()
  jobs:
  - job: WaitForProductionApproval
    displayName: Await production approval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      displayName: Approve production deployment
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: $(productionApprover)
        approvers: $(productionApprover)
        allowApproversToApproveTheirOwnRuns: true
        instructions: 'Approve to deploy academico-gateway to the production Kubernetes cluster on 20.115.132.131.'
        onTimeout: reject

- stage: DeployProduction
  displayName: Deploy to production Kubernetes
  dependsOn: ApproveProduction
  condition: succeeded()
  jobs:
  - job: DeployProduction
    displayName: Deploy gateway to production Kubernetes
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Login to Azure Container Registry
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - script: |
        bash "$(Build.SourcesDirectory)/scripts/deploy_k8s_production.sh"
      displayName: Deploy academico-gateway to production Kubernetes
      env:
        CONTAINER_REGISTRY: $(containerRegistry)
        IMAGE_REPOSITORY: $(imageRepository)
        TAG: $(tag)
        K8S_SSH_HOST: $(prodK8sSshHost)
        K8S_SSH_USER: $(sshUser)
        K8S_SSH_PRIVATE_KEY_B64: $(PROD_SSH_PRIVATE_KEY_B64)
        K8S_NAMESPACE: $(k8sNamespace)
        K8S_MANIFEST_DIR: $(k8sManifestDir)
        K8S_REMOTE_MANIFEST_PATH: $(k8sRemoteManifestPath)
        K8S_DEPLOYMENT: $(serviceName)
        K8S_CONTAINER: $(containerName)
        IMAGE_PULL_SECRET_NAME: $(imagePullSecretName)
        APP_SECRET_NAME: $(appSecretName)
        ROLLOUT_TIMEOUT: $(rolloutTimeout)
        LEGACY_DOCKER_CLEANUP_ENABLED: 'true'
        LOCAL_PORT_FORWARD_ENABLED: 'true'
        LOCAL_PORT_FORWARD_ADDRESS: ''
        APP_PORT: $(grpcPort)
        POST_ROLLOUT_SMOKE_ENABLED: 'true'
        POST_ROLLOUT_SMOKE_BASE_URL: '127.0.0.1:$(grpcPort)'
        POST_ROLLOUT_SMOKE_COMMAND: |
          set -euo pipefail

          target="${POST_ROLLOUT_SMOKE_BASE_URL:-127.0.0.1:${APP_PORT:-50050}}"
          timeout_seconds="${POST_ROLLOUT_SMOKE_TIMEOUT_SECONDS:-5}"

          if ! command -v grpcurl >/dev/null 2>&1; then
            echo "grpcurl is required for the gateway post-rollout smoke test."
            exit 1
          fi

          grpcurl -plaintext -max-time "$timeout_seconds" "$target" describe auth.v1.AuthService | grep -q 'ResetPassword'
        POST_ROLLOUT_SMOKE_ENV_VARIABLE_NAMES: ''
        POST_ROLLOUT_SMOKE_RETRIES: '12'
        POST_ROLLOUT_SMOKE_SLEEP_SECONDS: '5'
        POST_ROLLOUT_SMOKE_TIMEOUT_SECONDS: '5'
        ENV_VARIABLE_NAMES: NODE_ENV LOGIN_BASE_URL LOGIN_API_KEY NOTIFICACIONES_BASE_URL NOTIFICACIONES_API_KEY GRPC_PORT LOG_LEVEL
        NODE_ENV: production
        LOGIN_BASE_URL: http://academico-login:3001
        LOGIN_API_KEY: $(USUARIOS_API_KEY)
        NOTIFICACIONES_BASE_URL: http://academico-notificaciones:3003
        NOTIFICACIONES_API_KEY: $(NOTIFICACIONES_API_KEY)
        GRPC_PORT: $(grpcPort)
        LOG_LEVEL: info
